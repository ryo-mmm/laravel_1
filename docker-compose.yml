version: '3.8'

services:
    # ------------------
    # Nginx サービス
    # ------------------
    nginx:
        # 最新の安定版を使用 (例: 1.27系)
        image: nginx:1.27.0
        ports:
            - "80:80"
        volumes:
            # 設定ファイルのロード
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
            # アプリケーションコードのマウント
            - ./src:/var/www/
        depends_on:
            - php

    # ------------------
    # PHP サービス
    # ------------------
    php:
        # Dockerfileからビルド
        build:
            context: ./docker/php
            # M1環境でのビルドを意識し、platformを指定しない場合は、通常ARM版が自動選択される
            # 必要に応じて platform: linux/arm64 を明示することも検討するが、今回は公式イメージに委ねる
        volumes:
            - ./src:/var/www/
        # ホストOSと同じユーザーIDを使用し、ボリュームマウント時の権限問題を回避 (M1環境で特に有用)
        user: "${UID:-1000}:${GID:-1000}"
        environment:
            # ユーザー名を明示的に設定することで、プロンプトの表示を改善
            - USER=appuser

    # ------------------
    # MySQL サービス (M1/ARM最適化)
    # ------------------
    mysql:
        # MySQL 8.4 LTS (最新の安定版) を推奨。
        # M1環境でも公式イメージはarm64に対応しています。
        image: mysql:8.4
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: laravel_db
            MYSQL_USER: laravel_user
            MYSQL_PASSWORD: laravel_pass
        # MySQL 8系では 'mysql_native_password' の指定は原則不要になりましたが、互換性維持のため残置可
        # ただし、デフォルト設定のまま運用するのが最新のセキュリティ基準です。
        # command: mysqld --default-authentication-plugin=mysql_native_password
        volumes:
            # データベース永続化には「名前付きボリューム」を推奨
            - mysql_data:/var/lib/mysql
            - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
        ports:
            # ホストから直接アクセスしたい場合
            - "3306:3306"

    # ------------------
    # phpMyAdmin サービス
    # ------------------
    phpmyadmin:
        # 最新版は自動的に適切なアーキテクチャで取得されます
        image: phpmyadmin/phpmyadmin
        environment:
            PMA_HOST: mysql
            # PMA_ARBITRARY=1 は不要であれば削除し、セキュリティを向上させるべき
            PMA_USER: laravel_user
            PMA_PASSWORD: laravel_pass
        depends_on:
            - mysql
        ports:
            - 8080:80

# ------------------
# ボリューム定義 (永続化用)
# ------------------
volumes:
    mysql_data: